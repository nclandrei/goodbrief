name: Verify and Publish Newsletter

on:
  schedule:
    # The first pass allows Resend queueing; the second is the strict watchdog.
    - cron: '30 9 * * 1'
      timezone: 'Europe/Bucharest'
    - cron: '30 10 * * 1'
      timezone: 'Europe/Bucharest'
  workflow_dispatch:
    inputs:
      week:
        description: 'Exact delivered draft week to verify (e.g. 2026-W35)'
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: send-newsletter-production
  cancel-in-progress: false

jobs:
  verify_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      - name: Resolve exact delivered edition
        id: schedule
        env:
          REQUESTED_WEEK: ${{ inputs.week }}
        run: >-
          npx tsx scripts/resolve-newsletter-schedule.ts
          --phase verify
          --week "$REQUESTED_WEEK"

      - name: Require the current default-branch revision
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$DEFAULT_BRANCH")" ]; then
            echo "The checked-out workflow revision is stale; rerun from $DEFAULT_BRANCH."
            exit 1
          fi

      - name: Check publication preflight
        id: preflight
        run: npx tsx scripts/check-send-preflight.ts --week ${{ steps.schedule.outputs.week_id }}

      - name: Pin the approved draft snapshot
        id: draft_pin
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRAFT_PATH: data/drafts/${{ steps.schedule.outputs.week_id }}.json
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          local_blob=$(git rev-parse "HEAD:$DRAFT_PATH" 2>/dev/null || true)
          remote_blob=$(git rev-parse "origin/$DEFAULT_BRANCH:$DRAFT_PATH" 2>/dev/null || true)
          if [ "$local_blob" != "$remote_blob" ]; then
            echo "The approved draft changed on $DEFAULT_BRANCH; rerun with the current snapshot."
            exit 1
          fi
          echo "blob=$local_blob" >> "$GITHUB_OUTPUT"

      - name: Verify Resend delivery
        id: delivery
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          ALLOW_PENDING_EVENT: ${{ github.event.schedule == '30 9 * * 1' && 'true' || 'false' }}
        run: |
          args=(
            --week "${{ steps.schedule.outputs.week_id }}"
            --scheduled-at "${{ steps.schedule.outputs.scheduled_at }}"
          )
          local_time=$(TZ=Europe/Bucharest date +%H%M)
          if [ "$ALLOW_PENDING_EVENT" = "true" ] && [ "$local_time" -lt 1030 ]; then
            args+=(--allow-pending)
          fi
          npx tsx scripts/verify-newsletter-delivery.ts "${args[@]}"

      - name: Publish verified issue to website
        if: steps.delivery.outputs.ready_to_publish == 'true' && steps.preflight.outputs.issue_exists != 'true'
        run: npm run publish-issue -- --week ${{ steps.schedule.outputs.week_id }}

      - name: Record verified archive publication
        if: steps.delivery.outputs.ready_to_publish == 'true'
        run: npx tsx scripts/record-newsletter-published.ts --week ${{ steps.schedule.outputs.week_id }}

      - name: Stop if the approved draft changed during verification
        if: steps.delivery.outputs.ready_to_publish == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRAFT_PATH: data/drafts/${{ steps.schedule.outputs.week_id }}.json
          PINNED_DRAFT_BLOB: ${{ steps.draft_pin.outputs.blob }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          remote_blob=$(git rev-parse "origin/$DEFAULT_BRANCH:$DRAFT_PATH" 2>/dev/null || true)
          if [ "$remote_blob" != "$PINNED_DRAFT_BLOB" ]; then
            echo "The approved draft changed during verification; refusing to publish the stale snapshot."
            exit 1
          fi

      - name: Commit verified issue and delivery state
        id: publication_commit
        if: steps.delivery.outputs.ready_to_publish == 'true'
        run: |
          git config user.name "Andrei-Mihai Nicolae"
          git config user.email "andrei@nicolaeandrei.com"
          git add content/issues/ "data/deliveries/${{ steps.schedule.outputs.week_id }}.json"
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: publish verified issue for ${{ steps.schedule.outputs.week_id }}"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push verified publication
        if: steps.publication_commit.outputs.has_changes == 'true'
        uses: nick-fields/retry@v3
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRAFT_PATH: data/drafts/${{ steps.schedule.outputs.week_id }}.json
          PINNED_DRAFT_BLOB: ${{ steps.draft_pin.outputs.blob }}
        with:
          timeout_minutes: 4
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            git fetch origin "$DEFAULT_BRANCH"
            remote_blob=$(git rev-parse "origin/$DEFAULT_BRANCH:$DRAFT_PATH" 2>/dev/null || true)
            if [ "$remote_blob" != "$PINNED_DRAFT_BLOB" ]; then
              echo "The approved draft changed before publication was pushed."
              exit 1
            fi
            git pull --rebase
            current_blob=$(git rev-parse "HEAD:$DRAFT_PATH" 2>/dev/null || true)
            if [ "$current_blob" != "$PINNED_DRAFT_BLOB" ]; then
              echo "The approved draft changed during rebase."
              exit 1
            fi
            git push

      - name: Alert on workflow failure
        id: failure_email
        if: failure()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        run: |
          npm run alert-workflow-failure -- \
            --workflow "Verify and Publish Newsletter" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open a GitHub incident if email alerting failed
        if: ${{ failure() && steps.failure_email.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Newsletter] Verification workflow failed (run ${context.runId})`,
              body: `The newsletter verification workflow failed and its Resend email alert also failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
