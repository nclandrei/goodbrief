name: Score Weekly News

on:
  schedule:
    - cron: '30 9 * * 6'
      timezone: 'Europe/Bucharest'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week ID (e.g. 2026-W41). Leave empty for current week.'
        required: false
        type: string
      resume_run_id:
        description: 'Optional failed scoring run whose partial diagnostics should be restored.'
        required: false
        type: string
      llm_provider:
        description: 'Scoring provider. Default: gemini.'
        required: false
        type: choice
        default: gemini
        options:
          - gemini
          - openrouter

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  score_news:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: score-news-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Restore scoring diagnostics
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
          pattern: scoring-diagnostics-*
          path: data
          merge-multiple: true
      - name: Determine week and provider
        id: week
        env:
          REQUESTED_WEEK: ${{ inputs.week }}
          REQUESTED_LLM_PROVIDER: ${{ inputs.llm_provider }}
        run: |
          WEEK_ID="${REQUESTED_WEEK:-$(TZ=Europe/Bucharest date +%G-W%V)}"
          if [[ ! "$WEEK_ID" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "::error::Invalid week ID '$WEEK_ID'; expected YYYY-WXX."
            exit 1
          fi
          echo "id=$WEEK_ID" >> "$GITHUB_OUTPUT"
          if [ "$REQUESTED_LLM_PROVIDER" = "openrouter" ]; then
            echo 'llm_provider=openrouter' >> "$GITHUB_OUTPUT"
            echo 'llm_fallback=gemini' >> "$GITHUB_OUTPUT"
          else
            echo 'llm_provider=gemini' >> "$GITHUB_OUTPUT"
            echo 'llm_fallback=openrouter' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare and score the weekly pool only
        env:
          LLM_PROVIDER: ${{ steps.week.outputs.llm_provider }}
          LLM_FALLBACK: ${{ steps.week.outputs.llm_fallback }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_MAX_PROMPT_PRICE_PER_MILLION: ${{ vars.OPENROUTER_MAX_PROMPT_PRICE_PER_MILLION || '1' }}
          OPENROUTER_MAX_COMPLETION_PRICE_PER_MILLION: ${{ vars.OPENROUTER_MAX_COMPLETION_PRICE_PER_MILLION || '5' }}
          OPENROUTER_TIMEOUT_MS: '180000'
          OPENROUTER_MAX_RETRIES: '2'
          OPENROUTER_MAX_TOKENS: '32000'
          SCORE_BATCH_SIZE: '50'
        run: |
          for attempt in 1 2 3; do
            if npm run pipeline:prepare -- --week "${{ steps.week.outputs.id }}" --skip-existing && \
               npm run pipeline:score -- --week "${{ steps.week.outputs.id }}" --skip-existing; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 30))"
          done

      - name: Commit scored pool
        id: commit_outputs
        run: |
          git config user.name "Andrei-Mihai Nicolae"
          git config user.email "andrei@nicolaeandrei.com"
          git add "data/pipeline/${{ steps.week.outputs.id }}/01-prepared.json" "data/pipeline/${{ steps.week.outputs.id }}/02-scored.json"
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: score news for ${{ steps.week.outputs.id }}"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push scored pool
        if: steps.commit_outputs.outputs.has_changes == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 4
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            git config lfs.transfer.maxretries 12
            git config lfs.transfer.maxretrydelay 30
            git pull --rebase
            git push

      - name: Upload scoring diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scoring-diagnostics-${{ steps.week.outputs.id }}-${{ github.run_attempt }}
          path: |
            data/pipeline/${{ steps.week.outputs.id }}/01-prepared.json
            data/pipeline/${{ steps.week.outputs.id }}/02-scored.json
            data/pipeline/${{ steps.week.outputs.id }}/02-scored.partial.json
          if-no-files-found: warn

      - name: Alert on scoring failure
        id: failure_email
        if: failure()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        run: >-
          npm run alert-workflow-failure --
          --workflow "Score Weekly News"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --week "${{ steps.week.outputs.id }}"
          --artifact-name "scoring-diagnostics-${{ steps.week.outputs.id }}-${{ github.run_attempt }}"
          --resume-command "gh workflow run generate-newsletter.yml --field week=${{ steps.week.outputs.id }} --field resume_run_id=${{ github.run_id }}"

      - name: Open a GitHub incident if email alerting failed
        if: ${{ failure() && steps.failure_email.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Newsletter] Scoring failed (run ${context.runId})`,
              body: `Scoring failed and the Resend alert did not send.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
